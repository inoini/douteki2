<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>掲示板一覧</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" th:href="@{/css/header.css}">
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/list.css}">
</head>

<body>
	<div th:replace="fragments/header :: header"></div>
	<!-- =========================
     ヘッダー（LINE風）
========================= -->


	<!-- ログイン表示 -->


	<!-- =========================
     検索バー（短くする想定）
========================= -->
	<form action="/list" method="get" class="search-form">

		<input type="text" name="keyword" placeholder="検索..."
			th:value="${keyword}">

		<button type="submit">検索</button>

	</form>
	<div th:if="${param.error != null}"
		style="color: red; font-weight: bold; text-align: center; margin-top: 10px;">

		ログインしてください</div>
	<!-- =========================
     タイトル＆投稿ボタン
========================= -->
	<div class="header">

		<div style="text-align: right;">
			<span th:if="${isAdmin}"> 管理者 | <a href="/adminLogout">ログアウト</a>
			</span>
		</div>

		<h2>交流サイト</h2>

		<!-- ログイン中 -->
		<button th:if="${session.loginUser != null}" class="post-btn"
			onclick="openModal()">＋ 新しい投稿</button>

		<!-- 未ログイン -->
		<button th:if="${session.loginUser == null}" class="post-btn"
			onclick="location.href='/list?error=login'">＋ 新しい投稿</button>
		<div style="color: red;" th:if="${param.limit}">1日の投稿は2回までです</div>

	</div>

	<!-- =========================
     投稿モーダル
========================= -->
	<div id="modal" class="modal">

		<div class="modal-content sns-post">
			<div class="sns-header" th:if="${registered == null}">
				<span>新規投稿</span>
			</div>

			<form id="postForm" action="/post" method="post">



				<textarea name="message" placeholder="いまどうしてる？" required
					class="sns-textarea"></textarea>

				<!-- ⭐SNS入力（常時表示に変更） -->
				<div class="sns-box">

					<input type="text" id="twitterUser" placeholder="Twitter @user"
						class="sns-input"> <input type="text" id="instagramUser"
						placeholder="Instagram @user" class="sns-input"> <input
						type="text" name="discordName" placeholder="Discord ID"
						class="sns-input">

				</div>

				<!-- hidden -->
				<input type="hidden" name="snsUrl"> <input type="hidden"
					name="snsUrl2">

				<div class="post-buttons">
					<button type="submit" class="post-submit">新規登録</button>
					<button type="button" class="close-btn" onclick="closeModal()">閉じる</button>
				</div>
			</form>

		</div>
	</div>
	<hr>

	<!-- =========================
     投稿一覧
========================= -->
	<div class="container">

		<div th:each="p : ${posts}" class="card"
			th:classappend="${p.admin} ? 'admin-view' : ''">

			<div class="name">
				<span th:text="${p.name}"></span> <span th:if="${p.admin}">👑</span>
			</div>

			<p th:text="${p.message}"></p>

			<div class="time">
				<span th:text="${p.createdAt}"></span>
			</div>

			<div class="card-actions">

				<a th:href="@{/detail(id=${p.id})}" class="detail-btn"> 詳細 </a>





				<!-- 管理者だけ表示 -->

				<form
					th:if="${session.loginUser != null and session.loginUser.role == 'admin'}"
					th:action="@{/delete}" method="post" style="display: inline;">

					<input type="hidden" name="id" th:value="${p.id}">

					<button type="submit" onclick="return confirm('削除しますか？')">
						削除</button>

				</form>
			</div>
		</div>

	</div>

	<!-- =========================
     JS
========================= -->
	<script>

function openModal() {
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

// SNS変換
function makeTwitterUrl(user) {
  user = user.trim().replace(/^@/, '');
  return user ? 'https://twitter.com/' + user : '';
}

function makeInstagramUrl(user) {
  user = user.trim().replace(/^@/, '');
  return user ? 'https://instagram.com/' + user : '';
}

// 投稿時処理
const form = document.getElementById("postForm");

form.addEventListener("submit", function () {

  const twitter = document.getElementById("twitterUser").value;
  const insta = document.getElementById("instagramUser").value;

  document.querySelector("input[name='snsUrl']").value =
    makeTwitterUrl(twitter);

  document.querySelector("input[name='snsUrl2']").value =
    makeInstagramUrl(insta);
});

// ダークモード
function toggleDarkMode() {
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "dark",
    document.body.classList.contains("dark") ? "on" : "off"
  );
}

window.addEventListener("load", () => {
  if (localStorage.getItem("dark") === "on") {
    document.body.classList.add("dark");
  }
});

</script>

</body>
</html>
