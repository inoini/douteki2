<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>詳細</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/detail.css}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<div class="container">

		<div class="card">

			<div class="name" th:text="${post.name}"></div>

			<div class="message-box">
				<p th:text="${post.message}"></p>
			</div>

			<!-- SNS -->
			<p th:if="${post.snsUrl}">
				Twitter： <a
					th:href="${'https://twitter.com/' + #strings.replace(#strings.trim(post.snsUrl), ' ', '')}"
					target="_blank"> @<span th:text="${#strings.trim(post.snsUrl)}"></span>
				</a>
			</p>

			<p th:if="${post.snsUrl2}">
				Instagram： <a th:href="${'https://instagram.com/' + post.snsUrl2}"
					target="_blank"> @<span th:text="${post.snsUrl2}"></span>
				</a>
			</p>

			<!-- Discord -->
			<div th:if="${post.discordName}" style="margin-top: 10px;">
				<p>
					Discord： <span id="discordText" th:text="${post.discordName}"></span>
					<button type="button" onclick="copyDiscord()">コピー</button>
				</p>
			</div>

			<!-- 戻るボタン（外に出すのが正解） -->
			<div class="back-area">
				<a href="/list" class="back-btn">← 一覧に戻る</a>
			</div>
			<div th:if="${session.loginUser != null and session.loginUser.role == 'admin'}" class="delete-area">

				<form th:action="@{/delete}" method="post">

					<input type="hidden" name="id" th:value="${post.id}">

					<button type="submit" class="delete-btn"
						onclick="return confirm('削除しますか？')">削除</button>

				</form>

			</div>
		</div>

	</div>

	<script>
function copyDiscord() {

    const text = document.getElementById("discordText").innerText;

    if (!text || text.trim() === "") {
        showToast("Discord IDがありません");
        return;
    }

    navigator.clipboard.writeText(text)
        .then(() => {
            showToast("コピーしました！");
        })
        .catch(() => {
            showToast("コピー失敗");
        });
}

function showToast(message) {

    let toast = document.getElementById("bigToast");

    if (!toast) {
        toast = document.createElement("div");
        toast.id = "bigToast";
        toast.className = "big-toast";
        document.body.appendChild(toast);
    }

    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}
</script>

</body>
</html>
