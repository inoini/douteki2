
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ログイン</title>

<link rel="stylesheet" href="/css/login.css">

</head>

<body>

	<div class="login-container">

		<h2>ログイン</h2>

		<!-- エラー表示 -->
		<div th:if="${param.error != null}"
			style="color: red; margin-bottom: 10px;">IDまたはパスワードが違います</div>

		<form action="/login" method="post" autocomplete="off">

			<input type="text" name="id" placeholder="ID" required
				autocomplete="off">

			<div class="password-box">

				<input type="password" id="pass" name="password" placeholder="パスワード"
					required autocomplete="new-password">

				<button type="button" onclick="togglePass()">👁</button>

			</div>

			<button type="submit" class="login-btn">ログイン</button>

		</form>

		<a href="/list?keyword" class="home-btn">🏠 ホームに戻る</a>

	</div>

	<script>

function togglePass() {

	const pass = document.getElementById("pass");

	if (pass.type === "password") {
		pass.type = "text";
	} else {
		pass.type = "password";
	}
}

</script>

</body>
</html>
