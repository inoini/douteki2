<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー登録</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

	<div class="register-container">
		<h2>新規ユーザー登録</h2>

		<!-- 1. ログイン中の場合、またはボタンを押した後に「すでに登録済み」と判定された場合に表示 -->
		<p class="done-message" th:if="${session.user != null or param.already}">登録済みです</p>
		
		<!-- 2. 通常の登録完了メッセージ -->
		<p class="done-message" th:if="${param.done}">登録が完了しました！</p>

		<!-- ログインしていない場合、または登録画面を動かしたい場合はフォームを表示 -->
		<form th:action="@{/register}" method="post" autocomplete="off">
			<input type="text" name="id" placeholder="ID" required autocomplete="off"> 
			<input type="text" name="name" placeholder="名前" required autocomplete="off">

			<div class="password-box">
				<input type="password" id="pass" name="password" placeholder="パスワード"
					required autocomplete="new-password">
				<button type="button" onclick="togglePass()">👁</button>
			</div>

			<button type="submit" class="register-btn">登録する</button>
		</form>

		<a th:href="@{/login}" class="login-link">すでにアカウントをお持ちの方はこちら</a> 
		<a th:href="@{/list(keyword='')}" class="home-link">🏠 ホームへ戻る</a>
	</div>

	<script>
	function togglePass() {
	    const p = document.getElementById("pass");
	    p.type = (p.type === "password") ? "text" : "password";
	}
	</script>
</body>
</html>
