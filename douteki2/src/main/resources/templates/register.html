<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        .restriction-box { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center; }
        .done-message { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .error-message { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>新規ユーザー登録</h2>

        <!-- 1. 成功メッセージ -->
        <p class="done-message" th:if="${param.done}">登録が完了しました！</p>
        
        <!-- 2. エラーメッセージ -->
        <p class="error-message" th:if="${param.error}">登録に失敗しました。IDが既に使用されている可能性があります。</p>

        <!-- 3. 制限メッセージ：Javaから送られた registered が true の時、またはURLに ?already がある時 -->
        <div class="restriction-box" th:if="${registered or param.already}">
            <p><strong>登録済みです</strong></p>
            <p>荒らし対策のため、このブラウザからの新規登録は制限されています。</p>
        </div>

        <!-- 4. 入力フォーム：登録済みでない場合のみ表示 -->
        <form th:unless="${registered or param.already}" 
              th:action="@{/register}" method="post" autocomplete="off">
            
            <input type="text" name="id" placeholder="ID" required autocomplete="off"> 
            <input type="text" name="name" placeholder="名前" required autocomplete="off">

            <div class="password-box">
                <input type="password" id="pass" name="password" placeholder="パスワード"
                    required autocomplete="new-password">
                <button type="button" onclick="togglePass()">👁</button>
            </div>

            <button type="submit" class="register-btn">登録する</button>
        </form>

        <div class="nav-links" style="margin-top: 20px;">
            <a th:href="@{/login}" class="login-link">すでにアカウントをお持ちの方はこちら</a><br><br>
            <a th:href="@{/list(keyword='')}" class="home-link">🏠 ホームへ戻る</a>
        </div>
    </div>

    <script>
    function togglePass() {
        const p = document.getElementById("pass");
        p.type = (p.type === "password") ? "text" : "password";
    }
    </script>
</body>
</html>
