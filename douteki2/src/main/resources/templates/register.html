<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
    <div class="register-container">
        <h2>新規ユーザー登録</h2>

        <p class="done-message" th:if="${param.done}" style="color: green;">登録が完了しました！</p>

        <!-- ★修正：(registered ?: false) と書くことで、Java側で変数を忘れてもエラーになりません -->
        <div class="restriction-box" th:if="${(registered ?: false) or param.already}" style="background:#fff3cd; padding:10px; margin-bottom:10px;">
            <p><strong>登録済みです</strong></p>
            <p>このブラウザからの新規登録は制限されています。</p>
        </div>

        <!-- ★修正：フォームも同様に安全な判定に変更 -->
        <form th:unless="${(registered ?: false) or param.already}" 
              th:action="@{/register}" method="post" autocomplete="off">
            <input type="text" name="id" placeholder="ID" required> 
            <input type="text" name="name" placeholder="名前" required>
            <input type="password" id="pass" name="password" placeholder="パスワード" required>
              <button type="button" onclick="togglePass()">👁</button>
            <button type="submit" class="register-btn" style="margin-top:10px;">登録する</button>
        </form>

        <div class="nav-links" style="margin-top: 20px;">
            <a th:href="@{/login}">ログインはこちら</a><br><br>
            <a th:href="@{/list(keyword='')}">🏠 ホームへ戻る</a>
        </div>
    </div>
</body>
</html>
