<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー登録</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/register.css}">
<style>
    /* 追加の簡易スタイル：制限メッセージを際立たせる */
    .restriction-box {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: center;
    }
    .done-message {
        color: #155724;
        background-color: #d4edda;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
    }
</style>
</head>
<body>

	<div class="register-container">
		<h2>新規ユーザー登録</h2>

		<!-- 1. 成功メッセージ：登録直後に表示 -->
		<p class="done-message" th:if="${param.done}">登録が完了しました！</p>

		<!-- 2. 制限メッセージ：ログイン中、またはクッキーで「登録済み」と判定された場合に表示 -->
		<div class="restriction-box" th:if="${session.user != null or registered or param.already}">
			<p><strong>登録済みです</strong></p>
			<p>荒らし対策のため、このブラウザからの新規登録は制限されています。</p>
		</div>

		<!-- 3. 入力フォーム：登録済みでない（sessionにもcookieにも情報がない）場合のみ表示 -->
		<form th:unless="${session.user != null or registered or param.already}" 
		      th:action="@{/register}" method="post" autocomplete="off">
			
			<input type="text" name="id" placeholder="ID" required autocomplete="off"> 
			<input type="text" name="name" placeholder="名前" required autocomplete="off">

			<div class="password-box">
				<input type="password" id="pass" name="password" placeholder="パスワード"
					required autocomplete="new-password">
				<button type="button" onclick="togglePass()">👁</button>
			</div>

			<button type="submit" class="register-btn">登録する</button>
		</form>

		<!-- ナビゲーション -->
		<div class="nav-links" style="margin-top: 20px;">
			<a th:href="@{/login}" class="login-link">すでにアカウントをお持ちの方はこちら</a><br><br>
			<a th:href="@{/list(keyword='')}" class="home-link">🏠 ホームへ戻る</a>
		</div>
	</div>

	<script>
	function togglePass() {
	    const p = document.getElementById("pass");
	    p.type = (p.type === "password") ? "text" : "password";
	}
	</script>
</body>
</html>
