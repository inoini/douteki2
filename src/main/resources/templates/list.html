<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>掲示板一覧</title>

<style>
body {
	margin: 0;
	font-family: sans-serif;
	background: #f5f5f5;
}

/* ヘッダー */
.header {
	text-align: center;
	padding: 10px;
}

/* 投稿ボタン */
.post-btn {
	padding: 10px 20px;
	background: #007bff;
	color: white;
	border: none;
	cursor: pointer;
	border-radius: 6px;
}

/* グリッド */
.container {
	display: grid;
	grid-template-columns: repeat(6, 1fr);
	gap: 10px;
	padding: 10px;
	align-items: start;
}

/* ★正方形カード */
.card {
	background: white;
	border: 1px solid #ccc;
	padding: 10px;
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	border-radius: 0px;
	aspect-ratio: 1/1; /* ★正方形の核心 */
	min-width: 0;
	overflow: hidden;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

/* 管理者 */
.admin-card {
	background: linear-gradient(135deg, #fff7c0, #ffe680);
	border: 2px solid gold;
}

/* 名前 */
.name {
	font-weight: bold;
}

/* 王冠 */
.crown {
	color: gold;
}

/* 入力 */
input, textarea {
	width: 100%;
	margin: 5px 0;
	padding: 8px;
	box-sizing: border-box;
	border-radius: 6px;
	border: 1px solid #ccc;
}

textarea {
	min-height: 120px;
	background: #f7f7f7;
	resize: vertical;
}

/* モーダル */
.modal {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.5);
}

.modal-content {
	background: white;
	width: 90%;
	max-width: 400px;
	margin: 10% auto;
	padding: 20px;
	border-radius: 10px;
}

/* カード下ボタン */
.card-actions {
	margin-top: auto;
	display: flex;
	justify-content: space-between;
	gap: 5px;
}

.detail-btn {
	background: #007bff;
	color: white;
	padding: 5px 10px;
	border-radius: 5px;
	text-decoration: none;
	font-size: 13px;
}

.delete-btn {
	background: #dc3545;
	color: white;
	padding: 5px 10px;
	border-radius: 5px;
	text-decoration: none;
	font-size: 13px;
}

/* テキスト崩れ防止 */
.card p {
	word-break: break-word;
	overflow-wrap: anywhere;
	white-space: pre-wrap;
	min-width: 0;
}

/* リンク崩れ防止 */
.card a {
	display: block;
	max-width: 100%;
	word-break: break-word;
	overflow-wrap: anywhere;
	min-width: 0;
}

/* ページング */
.pagination {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 8px;
	margin: 20px 0;
}

.pagination a {
	padding: 6px 12px;
	border: 1px solid #ccc;
	border-radius: 6px;
	text-decoration: none;
	color: black;
	background: white;
}

.pagination a:hover {
	background: #007bff;
	color: white;
}

.pagination a.active {
	background: #007bff;
	color: white;
	font-weight: bold;
}

/* スマホ */
@media ( max-width :1000px) {
	.container {
		grid-template-columns: repeat(4, 1fr);
	}
}

@media ( max-width :600px) {
	.container {
		grid-template-columns: repeat(2, 1fr);
	}
}

input::placeholder {
	color: #aaa;
	font-size: 13px;
}

.button-area {
	display: flex;
	justify-content: flex-end; /* 右寄せ */
	gap: 10px; /* ボタン間の余白 */
	margin-top: 15px;
}

.btn {
	padding: 10px 18px;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	font-weight: bold;
}

.submit {
	background: #1877f2;
	color: white;
}

.close {
	background: #ccc;
	color: #333;
}
</style>
</head>

<body>

	<div class="header">

		<div style="text-align: right;">
			<span th:if="${isAdmin}"> 管理者 | <a href="/logout">ログアウト</a>
			</span> <span th:unless="${isAdmin}"> <a href="/adminLogin">管理者ログイン</a>
			</span>
		</div>

		<h2>交流サイト</h2>

		<button class="post-btn" onclick="openModal()">＋ 新しい投稿</button>

		<div style="color: red;" th:if="${param.limit}">1日の投稿は2回までです</div>
	</div>

	<!-- モーダル -->
	<div id="modal" class="modal">
		<div class="modal-content">

			<form action="/post" method="post">

				名前：<input type="text" name="name" required> メッセージ：
				<textarea name="message" required></textarea>
				SNS1：<input type="text" name="snsUrl" id="twitterUser"
					placeholder="@twitter_id"> SNS2：<input type="text"
					name="snsUrl2" id="instagramUser" placeholder="@instagram_id">

				Discord：<input type="text" name="discordName"
					placeholder="ユーザー名#0000">
				<div class="button-area">
					<button type="submit" class="btn submit">送信</button>
					<button type="button" class="btn close" onclick="closeModal()">閉じる</button>
				</div>
			</form>



		</div>
	</div>

	<hr>

	<!-- 投稿一覧 -->
	<div class="container">

		<div th:each="p : ${posts}" class="card"
			th:classappend="${p.admin} ? 'admin-card' : ''">

			<!-- 名前 -->
			<div class="name">
				<span th:text="${p.name}"></span> <span th:if="${p.admin}"
					class="crown">👑</span>
			</div>

			<!-- コメントだけ表示 -->
			<p th:utext="${p.message}"></p>


			<!-- ★詳細ボタンだけ残す -->
			<div class="card-actions">

    <!-- 詳細 -->
    <a th:href="@{/detail(id=${p.id})}" class="detail-btn">
        詳細
    </a>

    <!-- 管理者だけ表示 -->
    <span th:if="${isAdmin}">

        <form th:action="@{/delete}" method="post" style="display:inline;">

            <!-- 投稿ID -->
            <input type="hidden" name="id" th:value="${p.id}">

            <!-- CSRF（Spring Security使っている場合のみ有効） -->
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="delete-btn"
                    onclick="return confirm('本当に削除しますか？');">
                削除
            </button>

        </form>

    </span>

</div>

		</div>

	</div>

	<!-- ページング -->
	<div class="pagination">

		<a th:if="${currentPage > 1}"
			th:href="@{/list(page=${currentPage - 1})}">←</a> <span
			th:each="i : ${#numbers.sequence(1,20)}"> <a
			th:href="@{/list(page=${i})}"
			th:classappend="${i == currentPage} ? 'active' : ''" th:text="${i}">
		</a>
		</span> <a th:if="${currentPage < 20}"
			th:href="@{/list(page=${currentPage + 1})}">→</a>

	</div>

	<script>
function openModal(){
	document.getElementById("modal").style.display="block";
}
function closeModal(){
	document.getElementById("modal").style.display="none";
}
function copyDiscord(btn){
	const id = btn.getAttribute("data-id");

	navigator.clipboard.writeText(id).then(() => {
		alert("Discord IDをコピーしました: " + id);
	});
}

function makeTwitterUrl(user) {
  user = user.trim().replace(/^@/, '');
  if (!user) return '';
  return 'https://twitter.com/' + user;
}

function makeInstagramUrl(user) {
  user = user.trim().replace(/^@/, '');
  if (!user) return '';
  return 'https://instagram.com/' + user;
}

document.querySelector('form').addEventListener('submit', function () {
  const twitterUser = document.getElementById('twitterUser').value;
  const instagramUser = document.getElementById('instagramUser').value;
  
  document.querySelector('input[name="snsUrl"]').value = makeTwitterUrl(twitterUser);
  document.querySelector('input[name="snsUrl2"]').value = makeInstagramUrl(instagramUser);
});
</script>

</body>
</html>
